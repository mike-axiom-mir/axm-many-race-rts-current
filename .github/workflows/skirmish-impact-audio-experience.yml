name: Skirmish impact audio experience

on:
  pull_request:
    paths:
      - "src/combatImpactAudioPatch.js"
      - "src/skirmishEntry.js"
      - "settings.html"
      - "tests/combat-impact-audio-model.test.mjs"
      - "tests/browser/combat-impact-audio.spec.js"
      - ".github/workflows/skirmish-impact-audio-experience.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Impact audio contract / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact authored head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check focused syntax
        run: |
          node --check src/combatImpactAudioPatch.js
          node --check src/skirmishEntry.js
          node --check tests/browser/combat-impact-audio.spec.js
      - name: Run impact audio contracts
        run: |
          node --test tests/combat-impact-audio-model.test.mjs
          node --test tests/combat-damage-feedback-model.test.mjs
      - name: Check exact dependency diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

  chromium:
    name: Real Skirmish impact audio / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact authored head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:syntax
      - run: |
          node --test tests/combat-impact-audio-model.test.mjs
          node --test tests/combat-damage-feedback-model.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Exercise inherited visible hit plus procedural impact audio
        run: npx playwright test tests/browser/combat-damage-feedback.spec.js tests/browser/combat-impact-audio.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skirmish-impact-audio-evidence
          path: test-results/experience-evidence
          if-no-files-found: warn
          retention-days: 7
