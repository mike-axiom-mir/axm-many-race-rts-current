name: Explicit Forge runtime visual selection

on:
  pull_request:
    paths:
      - "src/forgeRuntimeVisual.js"
      - "src/verifiedForgeGlbConsumer.js"
      - "src/forgeAssetRequest.js"
      - "tests/forge-runtime-visual-contract.test.mjs"
      - "tests/forge-runtime-visual-browser-proof.mjs"
      - ".github/workflows/forge-runtime-visual.yml"
      - "docs/FORGE_RUNTIME_VISUAL_SELECTION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Node ${{ matrix.node }} visual-selection contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --experimental-default-type=module --check src/forgeRuntimeVisual.js
          node --check tests/forge-runtime-visual-browser-proof.mjs
      - name: Focused fail-closed regressions
        run: node --experimental-default-type=module --test tests/forge-runtime-visual-contract.test.mjs tests/verified-forge-glb-consumer.test.mjs tests/forge-audition-contract.test.mjs
      - name: Exact stacked-base whitespace gate
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"..HEAD

  exact-provider-runtime-rollback:
    name: Exact Forge GLB into live Three.js formation and rollback
    runs-on: ubuntu-latest
    env:
      PROVIDER_REF: 666409d64c15d9b836b56d0603f1c869b84d2bb4
      CONSUMER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check out exact Game Asset Forge provider
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/Axm-game-assets
          ref: ${{ env.PROVIDER_REF }}
          path: _provider/game-assets
      - name: Verify exact dependency heads
        run: |
          test "$(git rev-parse HEAD)" = "$CONSUMER_REF"
          test "$(git -C _provider/game-assets rev-parse HEAD)" = "$PROVIDER_REF"
      - name: Re-run provider and inherited consumer contracts
        run: |
          (cd _provider/game-assets && python -m py_compile native_pipeline.py native_glb_delivery.py && python native_pipeline_test.py && python native_glb_delivery_test.py)
          node --experimental-default-type=module --test tests/verified-forge-glb-consumer.test.mjs tests/forge-audition-contract.test.mjs tests/forge-runtime-visual-contract.test.mjs
      - name: Export exact Northpole Guard request
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { unitPackFrom } from "./src/contentPacks.js";
          const pack = unitPackFrom("northpole", ["guard"]);
          if (!pack || pack.units.length !== 1 || pack.units[0].id !== "guard") throw new Error("Northpole Guard unit pack unavailable");
          writeFileSync(`${process.env.RUNNER_TEMP}/guard-unit-pack.json`, `${JSON.stringify(pack, null, 2)}\n`);
          NODE
          node --experimental-default-type=module tools/export-forge-unit-request.mjs \
            --unit-pack "$RUNNER_TEMP/guard-unit-pack.json" --unit guard --asset-type rigid-proxy --unit-meters 1.82 \
            --source-ref "$CONSUMER_REF" --provider-ref "$PROVIDER_REF" \
            --output "$RUNNER_TEMP/forge-request.json" --receipt "$RUNNER_TEMP/forge-request-receipt.json"
      - name: Build caller-pinned provider package and deterministic GLB
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/_provider/game-assets" python - <<'PY'
          import json, os
          from pathlib import Path
          from native_geometry import make_box, write_obj
          from native_pipeline import build_rigid_package, verify_rigid_package
          temp = Path(os.environ["RUNNER_TEMP"])
          request = json.loads((temp / "forge-request.json").read_text(encoding="utf-8"))
          source = temp / "guard-rigid-proxy.obj"
          write_obj(make_box((0.65, 1.82, 0.42), name=request["asset"]["id"]), source, include_normals=False)
          package = build_rigid_package(source, temp / "rigid-package", material_size=32, seed=20260910)
          verified = verify_rigid_package(temp / "rigid-package", expected_manifest_sha256=package["manifest_sha256"])
          assert verified["status"] == "pass"
          (temp / "manifest-pin.txt").write_text(package["manifest_sha256"], encoding="utf-8")
          PY
          PYTHONPATH="$GITHUB_WORKSPACE/_provider/game-assets" python _provider/game-assets/native_glb_delivery.py \
            --package "$RUNNER_TEMP/rigid-package" \
            --expected-manifest-sha256 "$(cat "$RUNNER_TEMP/manifest-pin.txt")" \
            --consumer-request "$RUNNER_TEMP/forge-request.json" \
            --output "$RUNNER_TEMP/rts-northpole-guard.glb" \
            --receipt "$RUNNER_TEMP/rts-northpole-guard.glb.receipt.json"
      - name: Install exact CI-only browser dependencies
        run: |
          npm install --no-save --ignore-scripts three@0.180.0 playwright@1.55.0
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Serve exact RTS branch
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/forge-runtime-http.log" 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4173/forge-audition.html >/dev/null && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/forge-runtime-http.log"; exit 1
      - name: Execute real runtime visual install and rollback in Chromium
        env:
          AXM_FORGE_RUNTIME_VISUAL_FIXTURE_DIR: ${{ runner.temp }}
          AXM_FORGE_RUNTIME_VISUAL_EVIDENCE_DIR: ${{ runner.temp }}/forge-runtime-visual-evidence
        run: node tests/forge-runtime-visual-browser-proof.mjs
      - name: Independently validate retained runtime evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "forge-runtime-visual-evidence" / "evidence.json"
          e = json.loads(p.read_text(encoding="utf-8"))
          assert e["status"] == "PASS"
          assert e["assetId"] == "rts-northpole-guard" and e["unitId"] == "guard"
          assert e["visualSlots"] == 5 and e["fallbackSlotsRestored"] == 5
          assert e["installedMeshes"] >= 5
          assert e["renderInfo"]["calls"] > 0 and e["renderInfo"]["triangles"] > 0
          assert e["wrongRollbackRejected"] is True
          assert e["fallbackRestoredByIdentity"] is True and e["installedDetached"] is True
          assert e["gameplayUnchanged"] is True
          assert e["pageErrors"] == [] and e["consoleErrors"] == []
          assert e["authority"]["install"]["runtime_visual_mutation"] is True
          assert e["authority"]["install"]["gameplay_state_mutation"] is False
          assert e["authority"]["install"]["canonical_game_state_mutation"] is False
          assert e["authority"]["install"]["persistence"] is False
          print("EXPLICIT FORGE RUNTIME VISUAL + ROLLBACK PASS")
          print("installation", e["installationSha256"])
          print("rollback", e["rollbackSha256"])
          print("draw", e["renderInfo"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forge-runtime-visual-evidence
          path: ${{ runner.temp }}/forge-runtime-visual-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Exact stacked-base whitespace gate
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"..HEAD
