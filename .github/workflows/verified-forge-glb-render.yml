name: Verified Forge GLB renderer consumer

on:
  pull_request:
    paths:
      - "src/verifiedForgeGlbConsumer.js"
      - "tests/verified-forge-glb-consumer.test.mjs"
      - "tests/verified-forge-glb-browser-proof.mjs"
      - "docs/VERIFIED_FORGE_GLB_CONSUMER.md"
      - ".github/workflows/verified-forge-glb-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-contract:
    name: Node ${{ matrix.node }} consumer contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Check out exact consumer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check consumer syntax
        run: node --experimental-default-type=module --check src/verifiedForgeGlbConsumer.js
      - name: Run fail-closed consumer regressions
        run: node --experimental-default-type=module --test tests/verified-forge-glb-consumer.test.mjs
      - name: Whitespace gate against exact stacked base
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"..HEAD

  exact-provider-browser-render:
    name: Exact Game Asset Forge delivery to Chromium Three.js
    runs-on: ubuntu-latest
    env:
      PROVIDER_REF: 666409d64c15d9b836b56d0603f1c869b84d2bb4
      CONSUMER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact RTS consumer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check out exact Game Asset Forge delivery provider
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/Axm-game-assets
          ref: ${{ env.PROVIDER_REF }}
          path: _provider/game-assets
      - name: Verify exact heads
        run: |
          test "$(git rev-parse HEAD)" = "$CONSUMER_REF"
          test "$(git -C _provider/game-assets rev-parse HEAD)" = "$PROVIDER_REF"
      - name: Re-run provider-owned package and GLB regressions
        working-directory: _provider/game-assets
        run: |
          python -m py_compile native_pipeline.py native_glb_delivery.py
          python native_pipeline_test.py
          python native_glb_delivery_test.py
      - name: Export exact RTS rigid-proxy request
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { unitPackFrom } from "./src/contentPacks.js";
          const pack = unitPackFrom("northpole", ["guard"]);
          if (!pack || pack.units.length !== 1 || pack.units[0].id !== "guard") throw new Error("Northpole Guard unit pack unavailable");
          writeFileSync(`${process.env.RUNNER_TEMP}/guard-unit-pack.json`, `${JSON.stringify(pack, null, 2)}\n`);
          NODE
          node --experimental-default-type=module tools/export-forge-unit-request.mjs \
            --unit-pack "$RUNNER_TEMP/guard-unit-pack.json" \
            --unit guard \
            --asset-type rigid-proxy \
            --unit-meters 1.82 \
            --source-ref "$CONSUMER_REF" \
            --provider-ref "$PROVIDER_REF" \
            --output "$RUNNER_TEMP/forge-request.json" \
            --receipt "$RUNNER_TEMP/forge-request-receipt.json"
      - name: Build and caller-pin verify one real provider-owned rigid package
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/_provider/game-assets" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from native_geometry import make_box, write_obj
          from native_pipeline import build_rigid_package, verify_rigid_package

          temp = Path(os.environ["RUNNER_TEMP"])
          request = json.loads((temp / "forge-request.json").read_text(encoding="utf-8"))
          assert request["contract"] == "axm.rts.forge-unit-request/v0.1"
          assert request["asset"]["id"] == "rts-northpole-guard"
          assert request["asset"]["type"] == "rigid-proxy"
          assert request["targets"] == {"engines": ["threejs"], "delivery": ["glb"]}
          source = temp / "guard-rigid-proxy.obj"
          write_obj(make_box((0.65, 1.82, 0.42), name=request["asset"]["id"]), source, include_normals=False)
          package = build_rigid_package(source, temp / "rigid-package", material_size=32, seed=20260910)
          verified = verify_rigid_package(temp / "rigid-package", expected_manifest_sha256=package["manifest_sha256"])
          assert verified["status"] == "pass"
          (temp / "manifest-pin.txt").write_text(package["manifest_sha256"], encoding="utf-8")
          PY
      - name: Derive exact self-contained GLB through provider contract
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/_provider/game-assets" python _provider/game-assets/native_glb_delivery.py \
            --package "$RUNNER_TEMP/rigid-package" \
            --expected-manifest-sha256 "$(cat "$RUNNER_TEMP/manifest-pin.txt")" \
            --consumer-request "$RUNNER_TEMP/forge-request.json" \
            --output "$RUNNER_TEMP/rts-northpole-guard.glb" \
            --receipt "$RUNNER_TEMP/rts-northpole-guard.glb.receipt.json"
      - name: Install exact CI-only renderer proof dependencies
        run: |
          npm install --no-save --ignore-scripts three@0.180.0 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Parse and render provider GLB in real Chromium Three.js
        env:
          AXM_FORGE_GLB_FIXTURE_DIR: ${{ runner.temp }}
        run: node tests/verified-forge-glb-browser-proof.mjs | tee "$RUNNER_TEMP/verified-forge-glb-browser-evidence.json"
      - name: Independently bind final evidence bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          request = json.loads((temp / "forge-request.json").read_text(encoding="utf-8"))
          receipt = json.loads((temp / "rts-northpole-guard.glb.receipt.json").read_text(encoding="utf-8"))
          glb = (temp / "rts-northpole-guard.glb").read_bytes()
          evidence = json.loads((temp / "verified-forge-glb-browser-evidence.json").read_text(encoding="utf-8"))
          request_bytes = json.dumps(request, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          assert receipt["consumer_request"]["sha256"] == "sha256:" + hashlib.sha256(request_bytes).hexdigest()
          assert receipt["delivery"]["sha256"] == "sha256:" + hashlib.sha256(glb).hexdigest()
          assert evidence["glbSha256"] == receipt["delivery"]["sha256"]
          assert evidence["assetId"] == request["asset"]["id"]
          assert evidence["parseCalls"] == 1
          assert evidence["meshCount"] >= 1 and evidence["renderCalls"] >= 1 and evidence["triangles"] >= 1
          assert evidence["pageErrors"] == [] and evidence["consoleErrors"] == []
          print("RTS VERIFIED GLB -> THREE.JS RENDER PASS")
          print("request", receipt["consumer_request"]["sha256"])
          print("glb", receipt["delivery"]["sha256"], receipt["delivery"]["bytes"], "bytes")
          print("meshes", evidence["meshCount"], "draw_calls", evidence["renderCalls"], "triangles", evidence["triangles"])
          PY
      - name: Upload exact render evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-forge-glb-browser-evidence
          path: ${{ runner.temp }}/verified-forge-glb-browser-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Whitespace gate against exact stacked base
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"..HEAD
