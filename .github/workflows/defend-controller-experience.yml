name: Defend controller experience

on:
  push:
    branches:
      - automation/experience-defend-controller-loop-v1
  pull_request:
    paths:
      - defend.html
      - defend.css
      - src/defendControllerExperience.js
      - tests/browser/defend-controller.spec.js
      - .github/workflows/defend-controller-experience.yml

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --check src/defendControllerExperience.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/defend-controller.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defend-controller-render
          path: test-results/defend-controller-*.png
          if-no-files-found: warn
          retention-days: 7
