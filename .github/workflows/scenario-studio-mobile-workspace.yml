name: Scenario Studio mobile workspace

on:
  pull_request:
    paths:
      - "scenario.html"
      - "scenario.css"
      - "src/scenarioMobileWorkspace.js"
      - "src/scenarioStudio.js"
      - "src/scenarioRules.js"
      - "tests/scenario-studio-mobile-workspace-browser.mjs"
      - "tests/scenario-studio-rule-identity-*.mjs"
      - ".github/workflows/scenario-studio-mobile-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and inherited identity contract
        run: |
          node --check src/scenarioMobileWorkspace.js
          node --check src/scenarioStudio.js
          node --check src/scenarioRules.js
          node --check tests/scenario-studio-mobile-workspace-browser.mjs
          node --test tests/scenario-rule-identity-contract.test.mjs tests/scenario-studio-rule-identity-experience.test.mjs

  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bounded browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise phone authoring, content, truth repair and world view
        run: node tests/scenario-studio-mobile-workspace-browser.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-studio-mobile-workspace-evidence
          path: test-results/scenario-mobile-*.png
          if-no-files-found: warn
