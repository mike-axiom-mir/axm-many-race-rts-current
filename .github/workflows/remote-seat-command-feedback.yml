name: Remote seat command feedback experience

on:
  pull_request:
    paths:
      - "src/seatCommandAuthorityPatch.js"
      - "src/multiSeatHud.js"
      - "src/cityBrowserDirectSeat.js"
      - "src/seatControllers.js"
      - "src/world.js"
      - "src/factions.js"
      - "src/starterFactions.js"
      - "src/wildcardFaction.js"
      - "src/playtestRosterExpansion.js"
      - "tests/remote-seat-command-feedback-browser.mjs"
      - "tests/city-browser-direct-seat-contract.test.mjs"
      - ".github/workflows/remote-seat-command-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: exact seat-command contracts · Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout exact authored head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Assert exact authored head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Syntax and inherited bridge contract
        run: |
          node --experimental-default-type=module --check src/seatCommandAuthorityPatch.js
          node --experimental-default-type=module --check src/multiSeatHud.js
          node --check tests/remote-seat-command-feedback-browser.mjs
          node --experimental-default-type=module --test tests/city-browser-direct-seat-contract.test.mjs
      - name: Exact-base whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

  exact-provider-browser:
    name: exact direct provider -> real seat gate -> real HUD
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact authored head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout exact City browser-direct provider
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-city-multiplayer
          ref: 256f670d832633159a3d91b9e4f522a438e966b4
          path: _provider
          fetch-depth: 1
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert exact identities
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          test "$(git -C _provider rev-parse HEAD)" = "256f670d832633159a3d91b9e4f522a438e966b4"
      - name: Run provider-owned direct transport contracts
        run: |
          node --test _provider/browser/tests/manual_webrtc.test.mjs
          node --test _provider/browser/tests/browser_direct_package.test.mjs
      - name: Pack provider and install proof-only browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/axm-city-pack"
          CONSUMER_DIR="$RUNNER_TEMP/axm-rts-feedback-proof"
          mkdir -p "$PACK_DIR" "$CONSUMER_DIR"
          npm pack ./_provider/packages/browser-direct --pack-destination "$PACK_DIR" --json > "$RUNNER_TEMP/axm-city-pack.json"
          TGZ="$PACK_DIR/$(node -e 'const f=require(process.argv[1]); process.stdout.write(f[0].filename)' "$RUNNER_TEMP/axm-city-pack.json")"
          printf '%s\n' '{"name":"axm-rts-feedback-proof","private":true,"type":"module"}' > "$CONSUMER_DIR/package.json"
          npm install --prefix "$CONSUMER_DIR" --ignore-scripts --no-audit --no-fund "$TGZ" three@0.180.0 playwright@1.63.0
          cmp _provider/browser/manual_webrtc.mjs "$CONSUMER_DIR/node_modules/axm-city-browser-direct/manual_webrtc.mjs"
          echo "AXM_BRIDGE_NODE_MODULES=$CONSUMER_DIR/node_modules" >> "$GITHUB_ENV"
          echo "AXM_FEEDBACK_EVIDENCE_DIR=$GITHUB_WORKSPACE/evidence" >> "$GITHUB_ENV"
          "$CONSUMER_DIR/node_modules/.bin/playwright" install chromium
      - name: Exercise remote input acknowledgement in Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          node tests/remote-seat-command-feedback-browser.mjs | tee evidence/remote-seat-command-feedback.json
      - name: Retain exact-head frames and receipt
        uses: actions/upload-artifact@v4
        with:
          name: remote-seat-command-feedback-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
