name: Match history contract

on:
  pull_request:
    paths:
      - "src/matchStatsStore.js"
      - "tests/match-stats-history-contract.test.mjs"
      - ".github/workflows/match-history-contract.yml"
  push:
    branches: [main]
    paths:
      - "src/matchStatsStore.js"
      - "tests/match-stats-history-contract.test.mjs"
      - ".github/workflows/match-history-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check src/matchStatsStore.js
      - name: Persistent history contract
        run: node --test tests/match-stats-history-contract.test.mjs
