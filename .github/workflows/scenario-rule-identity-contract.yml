name: Scenario rule identity contract

on:
  pull_request:
    paths:
      - "src/scenarioRules.js"
      - "tests/scenario-rule-identity-contract.test.mjs"
      - ".github/workflows/scenario-rule-identity-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rule-identity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exercise exact scenario rule identity contract
        run: node --test tests/scenario-rule-identity-contract.test.mjs
